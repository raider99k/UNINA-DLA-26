# UNINA-DLA Deployment Configuration
# Edit these values to tune inference behavior without recompiling.

# Detection Thresholds
conf_threshold: 0.25
score_threshold: 0.45

# Enable class-wise NMS in postprocess (false = pure O2O / no suppression)
use_nms: false
nms_iou_threshold: 0.60

# Fallback input dimensions (auto-detected from the TensorRT engine at runtime)
# Dimensions must be multiples of 32 for DLA compatibility.
input_width: 960
input_height: 608

# Number of object classes and display names
num_classes: 4
class_names:
  - "Yellow"
  - "Blue"
  - "SmallOrange"
  - "LargeOrange"

# Performance Tuning
max_detections: 1000
preprocess_block_size: 32
postprocess_block_size: 16
