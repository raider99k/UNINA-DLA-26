[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unina_dla"
version = "1.0.0"
description = "Hardware-Native Real-Time Object Detection Framework for NVIDIA Jetson Orin DLA"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pasqui1010", email = "florets.sheaf_3c@icloud.com"}
]
keywords = [
    "deep-learning",
    "object-detection",
    "nvidia-dla",
    "jetson-orin",
    "tensorrt",
    "repvgg",
    "qat",
    "sparsity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "onnx>=1.14.0",
    "onnxsim>=0.4.33",
    "matplotlib>=3.3.0",
    "tqdm>=4.64.0",
    "numpy>=1.20.0",
    "pillow>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unina_dla*"]

[tool.setuptools.package-data]
"unina_dla" = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
